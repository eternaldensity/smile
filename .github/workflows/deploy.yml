name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            smile2-web/package-lock.json
            smile3-web/package-lock.json
            space-web/package-lock.json

      - name: Build smile2
        working-directory: smile2-web
        run: |
          npm ci
          npm test
          npm run build

      - name: Build smile3
        working-directory: smile3-web
        run: |
          npm ci
          npm test
          npm run build

      - name: Build space
        working-directory: space-web
        run: |
          npm ci
          npm test
          npm run build

      - name: Assemble site
        run: |
          mkdir -p site/smile2 site/smile3 site/space
          cp index.html site/index.html
          cp -r smile2-web/dist/* site/smile2/
          cp -r smile3-web/dist/* site/smile3/
          cp -r space-web/dist/* site/space/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
