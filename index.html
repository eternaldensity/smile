<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remade Games</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
      main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
      h1 { font-size: 1.6rem; }
      p.sub { color: #aaa; }
      ul.games { list-style: none; padding: 0; display: grid; gap: 12px; margin-top: 24px; }
      ul.games li a {
        display: block; padding: 16px; border: 1px solid #444; border-radius: 8px;
        color: inherit; text-decoration: none; background: #1a1a1a;
      }
      ul.games li a:hover { border-color: #888; background: #222; }
      ul.games li small { color: #aaa; }
    </style>
  </head>
  <body>
    <main>
      <h1>Remade Games</h1>
      <p class="sub">Modern web remakes of old Visual Basic games. Pick one:</p>
      <ul class="games">
        <li>
          <a href="smile2/">
            <strong>Smile Game II</strong><br />
            <small>Grid puzzler — keys, TNT, nitro, magnets, 24 levels. 1P + 2P.</small>
          </a>
        </li>
        <li>
          <a href="smile3/">
            <strong>Smile Game III</strong><br />
            <small>Gravity, conveyors, tolls &amp; sublevels, mince, balloons. 6 levels. 1P + 2P.</small>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
